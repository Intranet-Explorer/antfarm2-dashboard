<svg xmlns="http://www.w3.org/2000/svg" width="230" height="22" viewBox="0 0 230 22" role="img" aria-label="built with Claude and Rectangular">
  <title>built with Claude × Rectangular</title>
  <defs>
    <clipPath id="r"><rect width="230" height="22" rx="4"/></clipPath>
    <clipPath id="type">
      <rect x="80" y="0" width="140" height="22">
        <animate attributeName="width" begin="0s" dur="1.6s" calcMode="discrete" fill="freeze"
          values="0;0;0;6.6;13.2;19.8;26.4;33;39.6;46.2;52.8;59.4;66;72.6;79.2;85.8;92.4;99;105.6;112.2;118.8;125.4;132;140"/>
      </rect>
    </clipPath>
    <linearGradient id="sheenGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#r)">
    <rect width="74" height="22" fill="#140b02"/>
    <rect x="74" width="156" height="22" fill="#ffb000"/>

    <!-- periodic sheen across the amber half -->
    <rect x="-40" y="-4" width="28" height="30" fill="url(#sheenGrad)" transform="skewX(-20)">
      <animate id="sheen" attributeName="x" from="60" to="270" dur="0.9s" begin="2.6s;sheen.end+9s" fill="freeze"/>
    </rect>
  </g>

  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11">
    <!-- left label powers on like a CRT -->
    <text x="37" y="15" fill="#ffb000" text-anchor="middle" opacity="1">built with
      <animate attributeName="opacity" begin="0s" dur="0.35s" fill="freeze"
        values="0;0.9;0.1;1;0.4;1" keyTimes="0;0.2;0.35;0.55;0.75;1"/>
    </text>

    <!-- right label types out -->
    <text x="82" y="15" fill="#140b02" font-weight="700" textLength="132" lengthAdjust="spacingAndGlyphs" clip-path="url(#type)">Claude × Rectangular</text>

    <!-- block cursor follows the typing, blinks, then goes away -->
    <rect x="216" y="5" width="6" height="12" fill="#140b02" opacity="0">
      <animate attributeName="x" begin="0s" dur="1.6s" calcMode="discrete" fill="freeze"
        values="82;82;82;88.6;95.2;101.8;108.4;115;121.6;128.2;134.8;141.4;148;154.6;161.2;167.8;174.4;181;187.6;194.2;200.8;207.4;214;216"/>
      <animate attributeName="opacity" begin="0s" dur="3.4s" calcMode="discrete" fill="freeze"
        values="1;1;1;1;0;1;0;1;0;0" keyTimes="0;0.2;0.4;0.5;0.58;0.66;0.74;0.82;0.9;1"/>
    </rect>
  </g>
</svg>
